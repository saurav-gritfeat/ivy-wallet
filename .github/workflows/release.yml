name: Auto Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Demo APKs
        run: ./gradlew assembleDebug assembleDemo --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-output/ivy-wallet-debug.apk \;
          find app/build/outputs/apk/demo/ -name "*.apk" -exec cp {} release-output/ivy-wallet-demo.apk \;

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ivy-wallet-apks
          path: release-output/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Ivy Wallet {0}', github.ref_name) || 'Ivy Wallet (Latest Build)' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: release-output/*.apk
          generate_release_notes: true
