name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug and Demo APKs
        run: ./gradlew assembleDebug assembleDemo --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/ivy-wallet-debug.apk || true
          cp app/build/outputs/apk/demo/*.apk release-output/ivy-wallet-demo.apk || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Ivy Wallet ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: release-output/*.apk
          generate_release_notes: true
